[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sesametalk-agent-sdk"
version = "0.0.0"
description = "Developer-preview Python client for SesameTalk external AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["."]
include = ["sesametalk_agent_sdk*"]
